name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  core-tests:
    name: Tests de PalacioCore
    runs-on: ubuntu-latest
    container: swift:6.0
    defaults:
      run:
        working-directory: Packages/PalacioCore
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        run: swift build
      - name: Correr tests
        run: swift test

  app-build:
    name: Build de App iOS (Xcode)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Compilar Anatomía Canina para iOS
        run: xcodebuild -project AnatomiaCanina/AnatomiaCanina.xcodeproj -scheme AnatomiaCanina -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
      - name: Verificar las reglas del catálogo
        working-directory: AnatomiaCanina
        run: |
          anatomy_checks_dir="$(mktemp -d)"
          swiftc AnatomiaCanina/Catalog.swift Tests/VerifyCatalog.swift -o "$anatomy_checks_dir/verify-catalog"
          "$anatomy_checks_dir/verify-catalog"
