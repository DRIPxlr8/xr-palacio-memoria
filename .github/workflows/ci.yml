name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  core-tests:
    name: Tests de PalacioCore
    runs-on: ubuntu-latest
    container: swift:6.0
    defaults:
      run:
        working-directory: Packages/PalacioCore
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        run: swift build
      - name: Correr tests
        run: swift test

  # El build de la app con xcodebuild (macos-latest) se agrega cuando exista
  # PalacioMemoria.xcodeproj (rol A).
