name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  core-tests:
    name: Tests de PalacioCore
    runs-on: ubuntu-latest
    container: swift:6.0
    defaults:
      run:
        working-directory: Packages/PalacioCore
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        run: swift build
      - name: Correr tests
        run: swift test

  app-build:
    name: Build de App iOS (Xcode)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Compilar App iOS
        run: xcodebuild -project PalacioMemoria.xcodeproj -scheme PalacioMemoria -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
